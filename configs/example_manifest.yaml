# Example config for data.mode: manifest -- one CSV with a row per audio file.
#
#   chunk_path,latin,split,file_path
#   recs/XC123_chunk000.wav,Myotis myotis,train,recs/XC123.wav
#   recs/XC123_chunk001.wav,Myotis myotis,train,recs/XC123.wav
#   recs/XC456_chunk000.wav,Nyctalus noctula,val,recs/XC456.wav
#   ...
#
# label_col can hold any kind of class -- species, call type, song type,
# dialect, life stage, ... -- see "Not only species" in the README.
# The column names are set below (path_col, label_col, split_col, group_col).
# Paths are relative to audio_root (absolute paths are used as-is). Labels
# with spaces become underscores ("Myotis myotis" -> "Myotis_myotis").
# tools/prepare_chunks.py writes such a manifest when it cuts recordings into
# chunks; tools/add_noise_to_manifest.py appends a noise class.
#
# Copy this file, change the paths, then:
#   uv run train.py --config configs/my_manifest.yaml
# Every option and its default is listed in echotrain/options.py.

run_name: my_species_group
output_dir: runs
device: cuda:0             # else an Apple Silicon GPU (mps), else the CPU

data:
  mode: manifest
  manifest: /path/to/manifest_chunks.csv
  audio_root: /path/to/audio      # path_col values are relative to this
  path_col: chunk_path
  label_col: latin
  split_col: split
  group_col: file_path            # source recording of each chunk; its chunks are pooled in evaluation
  train_splits: [train]
  val_splits: [val]               # keep "test" for the final evaluate.py run
  # species_list: inputs/my_classes.txt   # optional: only train on these classes (one name per line)

audio:
  sample_rate: 32000
  clip_seconds: 5

taxonomy:
  genus_head: true                # parent group = first word of the label (the genus for species), or set genus_map; false = class head only
  # genus_map: inputs/my_species_genus_map.csv   # optional CSV with columns species,genus

model:
  name: effnet                    # effnet, passt, perch_effnet_b3, ... (README section 4); *_single if genus_head: false
  backbone: efficientnet_b3
  # passt_arch: auto              # PaSST only: auto picks the checkpoint closest to clip_seconds

augment:
  mixup_rate: 0.1

sampler:
  balanced: true
  noise_class: null               # set to the label of a background class (e.g. noise), if you have one
  noise_multiplier: 0.4

train:
  epochs: 100
  batch_size: 32
  num_workers: 8
  early_stop_patience: 15

eval:
  batch_size: 16
  num_workers: 8
