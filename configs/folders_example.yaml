# Template for a dataset stored as one folder per species:
#
#   /path/to/train/Bufo_bufo/*.wav
#   /path/to/train/Rana_temporaria/*.wav
#   /path/to/val/Bufo_bufo/*.wav
#   ...
#
# Folder names are the class names. Clips of any length and sample rate are
# accepted: they are resampled to audio.sample_rate and cropped/tiled to
# audio.clip_seconds. For long recordings, cut them into chunks first with
# tools/prepare_chunks.py so that no audio is thrown away.

run_name: my_species_group
output_dir: runs
device: cuda:0

data:
  mode: folders
  train_dir: /path/to/train
  val_dir: /path/to/val
  # species_list: inputs/my_species.txt   # optional: only train on these classes

audio:
  sample_rate: 32000
  clip_seconds: 5

taxonomy:
  genus_head: false

model:
  name: effnet_b3_single

sampler:
  balanced: true
  noise_class: null        # set to the folder name of a background class, if you have one

train:
  epochs: 50
  batch_size: 32
  num_workers: 8
